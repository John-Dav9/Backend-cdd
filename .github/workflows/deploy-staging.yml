name: Deploy Staging to VPS

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/cmciea
            git -C backend fetch origin staging
            git -C backend checkout staging
            git -C backend pull origin staging
            docker compose -f docker-compose.staging.yml up -d --build backend-staging frontend-staging
            docker image prune -f
